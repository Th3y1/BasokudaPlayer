<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basokuda Player - Beta</title>
    <style>
        :root {
            --bg-color: #0b0b0f;
            --card-bg: #16161f;
            --accent-color: #e50914;
            --text-color: #ffffff;
            --text-muted: #a0a0a5;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(11, 11, 15, 0.9);
            border-bottom: 1px solid #222;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .admin-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .admin-btn:hover {
            background-color: #b20710;
        }
        .main-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        h2 {
            border-left: 4px solid var(--accent-color);
            padding-left: 10px;
            margin-bottom: 20px;
        }
        .comments-section {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            margin-top: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            background: #20202b;
            border: 1px solid #333;
            border-radius: 4px;
            color: white;
            box-sizing: border-box;
            font-family: inherit;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        .submit-comment-btn {
            background-color: #2b2b38;
            color: white;
            border: 1px solid #444;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .submit-comment-btn:hover {
            background-color: #3b3b4d;
        }
        .comment {
            background: #20202b;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            border-left: 3px solid var(--accent-color);
            position: relative;
        }
        .comment .author {
            font-weight: bold;
            color: #fff;
        }
        .comment .date {
            font-size: 12px;
            color: var(--text-muted);
            float: right;
        }
        .comment .text {
            margin-top: 10px;
            color: #ddd;
            white-space: pre-wrap;
        }
        .comment-actions {
            margin-top: 10px;
            font-size: 13px;
        }
        .comment-actions button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            margin-right: 15px;
            padding: 0;
        }
        .comment-actions button:hover {
            color: white;
        }
        .delete-btn {
            color: #e50914 !important;
        }
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
        }
        .modal-content {
            background-color: var(--card-bg);
            margin: 15% auto;
            padding: 25px;
            border-radius: 8px;
            width: 320px;
            border: 1px solid #333;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }
        .close {
            color: var(--text-muted);
            float: right;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
        }
        .close:hover {
            color: white;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">Basokuda Player <span style="font-size: 12px; color: #e50914;">BETA</span></div>
    <button class="admin-btn" id="adminToggleBtn">Panel Admina</button>
</header>

<div class="main-container">
    <h2>Strona Główna (Wersja Beta)</h2>
    <p style="color: var(--text-muted);">Fundament gotowy. Mów co dodajemy dalej!</p>

    <div class="comments-section">
        <h3>Komentarze (<span id="commentCount">0</span>)</h3>
        
        <form id="commentForm" style="margin-top: 20px;">
            <div class="form-group">
                <label for="authorName">Twoje imię:</label>
                <input type="text" id="authorName" required placeholder="Wpisz imię...">
            </div>
            <div class="form-group">
                <label for="commentText">Komentarz:</label>
                <textarea id="commentText" required placeholder="Napisz coś..."></textarea>
            </div>
            <button type="submit" class="submit-comment-btn">Dodaj komentarz</button>
        </form>

        <div id="commentsContainer" style="margin-top: 25px;">
            <!-- Tutaj wpadają komentarze -->
        </div>
    </div>
</div>

<!-- Modal logowania -->
<div id="adminModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h3 style="margin-top: 0;">Autoryzacja</h3>
        <div class="form-group">
            <label for="adminPassword">Hasło administratora:</label>
            <input type="password" id="adminPassword" placeholder="Hasło...">
        </div>
        <button type="button" id="loginBtn" class="admin-btn" style="width: 100%;">Zaloguj się</button>
    </div>
</div>

<script>
    const ADMIN_PASSWORD = "Korneliusz1111";
    let isAdmin = false;

    const adminToggleBtn = document.getElementById('adminToggleBtn');
    const adminModal = document.getElementById('adminModal');
    const closeModal = document.querySelector('.close');
    const loginBtn = document.getElementById('loginBtn');
    const adminPasswordInput = document.getElementById('adminPassword');

    const commentForm = document.getElementById('commentForm');
    const authorNameInput = document.getElementById('authorName');
    const commentTextInput = document.getElementById('commentText');
    const commentsContainer = document.getElementById('commentsContainer');
    const commentCount = document.getElementById('commentCount');

    let comments = JSON.parse(localStorage.getItem('basokuda_comments')) || [];

    // Obsługa modalu
    adminToggleBtn.addEventListener('click', () => {
        if (isAdmin) {
            isAdmin = false;
            adminToggleBtn.textContent = "Panel Admina";
            adminToggleBtn.style.backgroundColor = "var(--accent-color)";
            alert("Wylogowano z panelu administratora.");
            renderComments();
        } else {
            adminModal.style.display = "block";
        }
    });

    closeModal.addEventListener('click', () => adminModal.style.display = "none");
    window.addEventListener('click', (e) => { if (e.target == adminModal) adminModal.style.display = "none"; });

    loginBtn.addEventListener('click', () => {
        if (adminPasswordInput.value === ADMIN_PASSWORD) {
            isAdmin = true;
            adminModal.style.display = "none";
            adminPasswordInput.value = "";
            adminToggleBtn.textContent = "Wyloguj (Admin)";
            adminToggleBtn.style.backgroundColor = "#27ae60";
            alert("Zalogowano pomyślnie!");
            renderComments();
        } else {
            alert("Nieprawidłowe hasło administratora!");
        }
    });

    // Dodawanie komentarza
    commentForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const author = authorNameInput.value.trim();
        const text = commentTextInput.value.trim();
        if (!author || !text) return;

        const newComment = {
            id: Date.now(),
            author,
            text,
            date: new Date().toLocaleDateString('pl-PL') + ' ' + new Date().toLocaleTimeString('pl-PL', {hour: '2-digit', minute:'2-digit'}),
            likes: 0
        };

        comments.unshift(newComment);
        saveAndRender();
        authorNameInput.value = '';
        commentTextInput.value = '';
    });

    window.deleteComment = function(id) {
        if (!isAdmin) return;
        if (confirm("Usunąć ten komentarz?")) {
            comments = comments.filter(c => c.id !== id);
            saveAndRender();
        }
    }

    window.likeComment = function(id) {
        const comment = comments.find(c => c.id === id);
        if (comment) {
            comment.likes++;
            saveAndRender();
        }
    }

    function saveAndRender() {
        localStorage.setItem('basokuda_comments', JSON.stringify(comments));
        renderComments();
    }

    function renderComments() {
        commentsContainer.innerHTML = '';
        commentCount.textContent = comments.length;

        if (comments.length === 0) {
            commentsContainer.innerHTML = '<p style="color: var(--text-muted); text-align: center;">Brak komentarzy. Bądź pierwszy!</p>';
            return;
        }

        comments.forEach(comment => {
            const div = document.createElement('div');
            div.className = 'comment';
            let deleteBtnHtml = isAdmin ? `<button class="delete-btn" onclick="deleteComment(${comment.id})">Usuń</button>` : '';

            div.innerHTML = `
                <span class="date">${comment.date}</span>
                <span class="author">${escapeHtml(comment.author)}</span>
                <div class="text">${escapeHtml(comment.text)}</div>
                <div class="comment-actions">
                    <button onclick="likeComment(${comment.id})">👍 Polub (${comment.likes})</button>
                    ${deleteBtnHtml}
                </div>
            `;
            commentsContainer.appendChild(div);
        });
    }

    function escapeHtml(text) {
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return text.replace(/[&<>"']/g, m => map[m]);
    }

    renderComments();
</script>

</body>
</html>
