<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strona z Komentarzami</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1, h2 {
            color: #2c3e50;
        }
        .admin-bar {
            text-align: right;
            margin-bottom: 20px;
        }
        .admin-bar button {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
        .admin-bar button:hover {
            background-color: #c0392b;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        button.submit-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button.submit-btn:hover {
            background-color: #2980b9;
        }
        .comment {
            background: #f9f9f9;
            border-left: 4px solid #3498db;
            padding: 12px 15px;
            margin-top: 15px;
            border-radius: 0 4px 4px 0;
            position: relative;
        }
        .comment .author {
            font-weight: bold;
            color: #2c3e50;
        }
        .comment .date {
            font-size: 12px;
            color: #7f8c8d;
            float: right;
        }
        .comment .text {
            margin-top: 8px;
            white-space: pre-wrap;
        }
        .comment-actions {
            margin-top: 10px;
            font-size: 14px;
        }
        .comment-actions button {
            background: none;
            border: none;
            color: #3498db;
            cursor: pointer;
            padding: 0;
            margin-right: 15px;
        }
        .comment-actions button:hover {
            text-decoration: underline;
        }
        .delete-btn {
            color: #e74c3c !important;
        }
        /* Modal logowania */
        .modal {
            display: none;
            position: fixed;
            z-index: 10;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background-color: #white;
            background: #fff;
            margin: 15% auto;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .close:hover {
            color: #000;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="admin-bar">
        <button id="adminToggleBtn">Panel Administratora</button>
    </div>

    <h1>Sekcja Komentarzy</h1>

    <!-- Formularz dodawania komentarza -->
    <form id="commentForm">
        <div class="form-group">
            <label for="authorName">Twoje imię:</label>
            <input type="text" id="authorName" required placeholder="Wpisz swoje imię...">
        </div>
        <div class="form-group">
            <label for="commentText">Treść komentarza:</label>
            <textarea id="commentText" required placeholder="Napisz coś..."></textarea>
        </div>
        <button type="submit" class="submit-btn">Dodaj komentarz</button>
    </form>

    <hr style="margin: 30px 0; border: 0; border-top: 1px solid #ddd;">

    <h2>Komentarze (<span id="commentCount">0</span>)</h2>
    <div id="commentsContainer">
        <!-- Tutaj dynamicznie trafiają komentarze -->
    </div>
</div>

<!-- Modal logowania admina -->
<div id="adminModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h3>Logowanie do panelu</h3>
        <div class="form-group">
            <label for="adminPassword">Hasło:</label>
            <input type="password" id="adminPassword" placeholder="Wpisz hasło...">
        </div>
        <button type="button" id="loginBtn" class="submit-btn" style="width: 100%;">Zaloguj się</button>
    </div>
</div>

<script>
    // Konfiguracja i stan
    const ADMIN_PASSWORD_HASH = "Korneliusz1111"; // Nowe hasło
    let isAdmin = false;
    
    // Pobieranie elementów DOM
    const commentForm = document.getElementById('commentForm');
    const authorNameInput = document.getElementById('authorName');
    const commentTextInput = document.getElementById('commentText');
    const commentsContainer = document.getElementById('commentsContainer');
    const commentCount = document.getElementById('commentCount');
    
    const adminToggleBtn = document.getElementById('adminToggleBtn');
    const adminModal = document.getElementById('adminModal');
    const closeModal = document.querySelector('.close');
    const loginBtn = document.getElementById('loginBtn');
    const adminPasswordInput = document.getElementById('adminPassword');

    // Inicjalizacja bazy komentarzy z localStorage
    let comments = JSON.parse(localStorage.getItem('site_comments')) || [];

    // Obsługa modalu logowania
    adminToggleBtn.addEventListener('click', () => {
        if (isAdmin) {
            isAdmin = false;
            adminToggleBtn.textContent = "Panel Administratora";
            adminToggleBtn.style.backgroundColor = "#e74c3c";
            alert("Wylogowano z panelu administratora.");
            renderComments();
        } else {
            adminModal.style.display = "block";
        }
    });

    closeModal.addEventListener('click', () => {
        adminModal.style.display = "none";
    });

    window.addEventListener('click', (e) => {
        if (e.target == adminModal) {
            adminModal.style.display = "none";
        }
    });

    loginBtn.addEventListener('click', () => {
        if (adminPasswordInput.value === ADMIN_PASSWORD_HASH) {
            isAdmin = true;
            adminModal.style.display = "none";
            adminPasswordInput.value = "";
            adminToggleBtn.textContent = "Wyloguj (Admin)";
            adminToggleBtn.style.backgroundColor = "#27ae60";
            alert("Zalogowano pomyślnie jako administrator!");
            renderComments();
        } else {
            alert("Błędne hasło!");
        }
    });

    // Obsługa wysyłania formularza
    commentForm.addEventListener('submit', (e) => {
        e.preventDefault();
        
        const author = authorNameInput.value.trim();
        const text = commentTextInput.value.trim();

        if(!author || !text) return;

        const newComment = {
            id: Date.now(),
            author: author,
            text: text,
            date: new Date().toLocaleDateString('pl-PL') + ' ' + new Date().toLocaleTimeString('pl-PL', {hour: '2-digit', minute:'2-digit'}),
            likes: 0
        };

        comments.unshift(newComment); // Dodaj na początek tablicy
        saveAndRender();

        // Wyczyść formularz
        authorNameInput.value = '';
        commentTextInput.value = '';
    });

    // Funkcja usuwania komentarza
    window.deleteComment = function(id) {
        if (!isAdmin) return;
        if (confirm("Czy na pewno chcesz usunąć ten komentarz?")) {
            comments = comments.filter(c => c.id !== id);
            saveAndRender();
        }
    }

    // Funkcja polubień
    window.likeComment = function(id) {
        const comment = comments.find(c => c.id === id);
        if (comment) {
            comment.likes++;
            saveAndRender();
        }
    }

    // Zapis do localStorage i ponowne renderowanie
    function saveAndRender() {
        localStorage.setItem('site_comments', JSON.stringify(comments));
        renderComments();
    }

    // Renderowanie komentarzy na stronie
    function renderComments() {
        commentsContainer.innerHTML = '';
        commentCount.textContent = comments.length;

        if (comments.length === 0) {
            commentsContainer.innerHTML = '<p style="color: #7f8c8d; text-align: center;">Brak komentarzy. Bądź pierwszy!</p>';
            return;
        }

        comments.forEach(comment => {
            const commentDiv = document.createElement('div');
            commentDiv.className = 'comment';
            
            let deleteButtonHtml = isAdmin ? `<button class="delete-btn" onclick="deleteComment(${comment.id})">Usuń</button>` : '';

            commentDiv.innerHTML = `
                <span class="date">${comment.date}</span>
                <span class="author">${escapeHtml(comment.author)}</span>
                <div class="text">${escapeHtml(comment.text)}</div>
                <div class="comment-actions">
                    <button onclick="likeComment(${comment.id})">👍 Polub (${comment.likes})</button>
                    ${deleteButtonHtml}
                </div>
            `;
            commentsContainer.appendChild(commentDiv);
        });
    }

    // Pomocnicza funkcja zabezpieczająca przed XSS
    function escapeHtml(text) {
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return text.replace(/[&<>"']/g, function(m) { return map[m]; });
    }

    // Pierwsze uruchomienie renderowania
    renderComments();
</script>

</body>
</html>
