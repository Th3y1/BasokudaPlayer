<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BasokudaPlayer - Odtwarzacz Anime</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        header {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 2px solid #1f2833;
            margin-bottom: 20px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: #a855f7;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
        }

        /* Sekcja Wyszukiwarki */
        .search-box {
            position: relative;
            width: 100%;
            max-width: 350px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #45a29e;
            background: #1f2833;
            color: #fff;
            outline: none;
            font-size: 0.95rem;
        }

        .search-box input:focus {
            border-color: #a855f7;
            box-shadow: 0 0 8px rgba(168, 85, 247, 0.4);
        }

        /* Pasek z wynikami wyszukiwania */
        .search-results {
            position: absolute;
            top: 110%;
            left: 0;
            width: 100%;
            background: #1f2833;
            border: 1px solid #a855f7;
            border-radius: 8px;
            max-height: 250px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }

        .search-results div {
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 1px solid #27272a;
            color: #fff;
            font-weight: 500;
            transition: background 0.2s;
        }

        .search-results div:hover {
            background: #a855f7;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 1000px;
            width: 100%;
        }

        /* Odtwarzacz */
        .player-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #1f2833;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }

        .player-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .anime-info {
            background: #1f2833;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #27272a;
        }

        .anime-title {
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 8px;
        }

        .anime-desc {
            font-size: 0.95rem;
            color: #c5c6c7;
            line-height: 1.5;
        }

        .playlist {
            background: #1f2833;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #27272a;
        }

        .playlist h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #fff;
            border-left: 4px solid #a855f7;
            padding-left: 10px;
        }

        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px;
        }

        .episode-btn {
            background: #0b0c10;
            color: #fff;
            border: 1px solid #45a29e;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease-in-out;
            text-align: center;
        }

        .episode-btn:hover, .episode-btn.active {
            background: #a855f7;
            border-color: #a855f7;
        }

        footer {
            margin-top: auto;
            padding-top: 30px;
            font-size: 0.85rem;
            color: #666;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ BasokudaPlayer</div>
        <!-- Pasek Wyszukiwania -->
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Szukaj anime..." oninput="filterAnime()">
            <div id="search-results" class="search-results"></div>
        </div>
    </header>

    <div class="main-container">
        <div class="player-wrapper">
            <iframe id="video-player" src="" allowfullscreen></iframe>
        </div>

        <div class="anime-info">
            <h1 class="anime-title" id="current-title">Wybierz anime</h1>
            <p class="anime-desc" id="current-desc">Użyj wyszukiwarki lub wybierz serię z listy.</p>
        </div>

        <div class="playlist">
            <h2>Lista Odcinków</h2>
            <div class="episodes-grid" id="episodes-list">
                <!-- Odcinki generują się automatycznie po wybraniu anime -->
            </div>
        </div>
    </div>

    <footer>
        BasokudaPlayer &copy; 2026 – Własny Odtwarzacz Anime
    </footer>

    <script>
        // TUTAJ DODAJSZ SWOJE ANIME I LINKI
        const animeDatabase = [
            {
                title: "Isekai Yakkyoku",
                desc: "Młody farmaceuta reinkarnuje się w innym świecie z nieskończonymi zasobami many i tworzy nowoczesną medycynę.",
                episodes: [
                    { ep: "Odcinek 1", url: "https://www.youtube.com/embed/dQw4w9WgXcQ" },
                    { ep: "Odcinek 2", url: "LINK_DO_EMBED_ODC_2" },
                    { ep: "Odcinek 3", url: "LINK_DO_EMBED_ODC_3" }
                ]
            },
            {
                title: "Overlord",
                desc: "Gracz zostaje uwięziony w swojej ulubionej grze MMORPG jako potężny kościsty czarnoksiężnik Ainz Ooal Gown.",
                episodes: [
                    { ep: "Odcinek 1", url: "LINK_DO_OVERLORD_1" },
                    { ep: "Odcinek 2", url: "LINK_DO_OVERLORD_2" }
                ]
            },
            {
                title: "The Eminence in Shadow",
                desc: "Chłopiec odradza się w świecie magii i tworzy tajną organizację Shadow Garden.",
                episodes: [
                    { ep: "Odcinek 1", url: "LINK_DO_EMINENCE_1" }
                ]
            }
        ];

        let currentAnime = animeDatabase[0];

        // Funkcja ładowania wybranego anime
        function loadAnime(anime) {
            currentAnime = anime;
            document.getElementById('current-desc').innerText = anime.desc;
            
            const episodesContainer = document.getElementById('episodes-list');
            episodesContainer.innerHTML = '';

            anime.episodes.forEach((episode, index) => {
                const btn = document.createElement('button');
                btn.className = 'episode-btn' + (index === 0 ? ' active' : '');
                btn.innerText = episode.ep;
                btn.onclick = function() {
                    changeVideo(episode.url, episode.ep, btn);
                };
                episodesContainer.appendChild(btn);
            });

            if(anime.episodes.length > 0) {
                changeVideo(anime.episodes[0].url, anime.episodes[0].ep, episodesContainer.children[0]);
            }
        }

        function changeVideo(url, epTitle, btn) {
            document.getElementById('video-player').src = url;
            document.getElementById('current-title').innerText = currentAnime.title + " – " + epTitle;

            let buttons = document.querySelectorAll('.episode-btn');
            buttons.forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
        }

        // Logika Wyszukiwarki
        function filterAnime() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const resultsBox = document.getElementById('search-results');
            resultsBox.innerHTML = '';

            if (query.trim() === '') {
                resultsBox.style.display = 'none';
                return;
            }

            const filtered = animeDatabase.filter(anime => anime.title.toLowerCase().includes(query));

            if (filtered.length > 0) {
                resultsBox.style.display = 'block';
                filtered.forEach(anime => {
                    const div = document.createElement('div');
                    div.innerText = anime.title;
                    div.onclick = () => {
                        loadAnime(anime);
                        resultsBox.style.display = 'none';
                        document.getElementById('search-input').value = anime.title;
                    };
                    resultsBox.appendChild(div);
                });
            } else {
                resultsBox.style.display = 'none';
            }
        }

        // Domyślne załadowanie pierwszego anime
        loadAnime(animeDatabase[0]);
    </script>
</body>
</html>
